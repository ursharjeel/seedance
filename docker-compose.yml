services:
  leo2api:
    build: .
    # Bind to loopback only — expose via nginx reverse proxy when ready.
    # DO NOT change to 0.0.0.0 without first putting it behind a gateway.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./config:/app/config
      - ./generated:/app/generated
    environment:
      - TZ=Asia/Shanghai
      # Optional: use Redis for token/log storage (requires a redis service).
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      # - REDIS_PASSWORD=your-redis-password
    networks:
      - default
      - new-api-network
    restart: unless-stopped

networks:
  new-api-network:
    external: true
    name: new-api_new-api-network
